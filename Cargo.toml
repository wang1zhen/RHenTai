[workspace]
members = [
    "crates/eh-client",
    "crates/rhentai-core",
    "crates/rhentai-cli",
    "src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["RHenTai Developers"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tauri = { version = "2.12" }
tauri-build = { version = "2.7" }
tauri-plugin-dialog = { version = "2.8" }
tauri-plugin-opener = { version = "2.7" }
tauri-plugin-log = { version = "2.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "cookies", "json", "socks", "stream"] }
cookie_store = "0.22"
reqwest_cookie_store = "0.10"
scraper = "0.27"
regex = "1"
thiserror = "2"
url = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
zip = "9"
ts-rs = "12"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6"
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
sha1 = "0.10"
tokio-util = "0.7"
bytes = "1"
futures = "0.3"
natord = "1"

# Internal crates
eh-client = { path = "crates/eh-client" }
rhentai-core = { path = "crates/rhentai-core" }
